[pytest]
testpaths = tests
python_files = test_*.py
addopts = -q
# Предупреждения сторонних библиотек, к нашему коду отношения не имеют и на
# него не влияют. Глушим точечно по тексту, чтобы собственные предупреждения
# проекта по-прежнему были видны:
#   - привязки OR-Tools (SWIG) на Python 3.12 и новее;
#   - тестовый клиент starlette про httpx и старый alias anyio.
filterwarnings =
    ignore:builtin type .* has no __module__ attribute:DeprecationWarning
    ignore:Using `httpx` with `starlette.testclient` is deprecated
    ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning
